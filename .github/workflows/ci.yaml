name: hmap CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install fish 4
        uses: fish-shop/install-fish-shell@v2
      - name: Run Fishtape tests
        uses: fish-shop/run-fishtape-tests@v2
        with:
          patterns: tests/*.fish
  lint:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install fish 4
        uses: fish-shop/install-fish-shell@v2
      - name: Check indent
        uses: fish-shop/indent-check@v2
        with:
          patterns: completions/*.fish functions/*.fish tests/*.fish

  release:
    needs: [test, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: haya14busa/action-bumpr@v1
